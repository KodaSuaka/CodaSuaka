# =============================================================================
# CodaSuaka Frontend CI - Android
# =============================================================================
# Workflow ini menjalankan build & testing otomatis untuk Android app
# Trigger: push ke main/development, pull request ke main/development
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, development]
    paths:
      - 'coda-suaka-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'coda-suaka-frontend/**'
      - '.github/workflows/frontend-ci.yml'

# Cancel in-progress runs untuk branch yang sama
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Lint & Code Quality
  # ===========================================================================
  lint:
    name: 🔍 Lint Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coda-suaka-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: 🔎 Run lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: 📊 Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: coda-suaka-frontend/app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Job 2: Unit Tests
  # ===========================================================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: coda-suaka-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🧪 Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: coda-suaka-frontend/app/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Job 3: Build APK (Debug)
  # ===========================================================================
  build:
    name: 📦 Build APK
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: coda-suaka-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 📦 Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 📥 Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: coda-suaka-frontend/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # Job 4: Build Release APK (hanya untuk push ke main)
  # ===========================================================================
  build-release:
    name: 🚀 Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: coda-suaka-frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 📂 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🏗️ Build release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          # Signing akan dilakukan jika signing properties tersedia
          # Untuk sekarang build unsigned release
          BASE_URL: "https://codasuaka.my.id/"

      - name: 📥 Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: coda-suaka-frontend/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
